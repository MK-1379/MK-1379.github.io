<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada · Mario Díaz González</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <style>
      :root {
        --bg: #faf9ff;
        --text: #1b1633;
        --text-muted: #5b5678;
        --accent: #6d28d9;
        --on-accent: #faf9ff;
      }

      .dark {
        --bg: #0e0b1a;
        --text: #edebfa;
        --text-muted: #a09bbf;
        --accent: #8b5cf6;
        --on-accent: #0e0b1a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background-color: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      main {
        max-width: 32rem;
      }

      .code {
        margin: 0;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 0.875rem;
        color: var(--accent);
      }

      h1 {
        margin: 0.75rem 0 0;
        font-size: 2.25rem;
        line-height: 1.2;
      }

      p {
        margin: 1rem 0 0;
        font-size: 1.125rem;
        color: var(--text-muted);
      }

      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.375rem;
        background-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        opacity: 0.9;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1 id="title">Esta página no existe</h1>
      <p id="text">Puede que el enlace esté mal escrito o que la página se haya movido.</p>
      <a id="home" href="/">Volver al inicio</a>
    </main>
    <script>
      (function () {
        var english = false
        try {
          var stored = localStorage.getItem('locale')
          english = stored ? stored === 'en' : navigator.language.toLowerCase().startsWith('en')
        } catch (e) {}
        if (!english) return
        document.documentElement.lang = 'en'
        document.title = 'Page not found · Mario Díaz González'
        document.getElementById('title').textContent = 'This page does not exist'
        document.getElementById('text').textContent = 'The link may be mistyped or the page may have moved.'
        document.getElementById('home').textContent = 'Back to home'
      })()
    </script>
  </body>
</html>
